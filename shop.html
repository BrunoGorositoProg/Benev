<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colección | Benev</title>
  <link rel="icon" href="assets/img/favicon.png">

  <!-- CSS — orden importante: variables → global → página → módulos -->
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/card.css">
  <link rel="stylesheet" href="assets/css/shop.css">
  <link rel="stylesheet" href="assets/css/cart.css">
  <link rel="stylesheet" href="assets/css/animation.css">

  <!-- ICONS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body data-page="shop">

  <div id="navbar"></div>

  <main>

    <!-- HERO -->
    <section class="shop-hero">
      <div class="container">
        <span class="label">Colección</span>
        <h1>Prendas Premium</h1>
        <p>Diseñadas para el día a día. Construidas para durar.</p>
      </div>
    </section>

    <!-- FILTROS -->
    <section class="shop-toolbar">
      <div class="container toolbar-container">

        <div class="toolbar-left">
          <button class="filter-btn active" data-filter="all">Todos</button>
          <button class="filter-btn" data-filter="hoodie">Hoodies</button>
          <button class="filter-btn" data-filter="zip">Zip</button>
          <button class="filter-btn" data-filter="limited">Limited</button>
        </div>

        <div class="toolbar-right">
          <select id="sort-products" aria-label="Ordenar productos">
            <option value="new">Más nuevos</option>
            <option value="price-asc">Precio ↑</option>
            <option value="price-desc">Precio ↓</option>
          </select>
        </div>

      </div>
    </section>

    <!-- PRODUCTOS -->
    <section class="shop-products">
      <div class="container">
        <div id="shop-products" class="shop-grid"></div>
      </div>
    </section>

  </main>

  <div id="footer"></div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="components/navbar.js"></script>
  <script src="components/footer.js"></script>
  <script src="components/card.js"></script>
  <script src="components/cartDrawer.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/animations.js"></script>
  <script src="assets/js/app.js"></script>

</body>
</html>
