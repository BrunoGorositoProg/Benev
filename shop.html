<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Collection | Benev</title>
    <link rel="stylesheet" href="assets/css/product.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/cart.css">
    <link rel="stylesheet" href="assets/css/animations.css">

</head>

<body data-page="shop">

<div id="navbar"></div>

<main>

    <!-- SHOP HERO -->

    <section class="shop-hero">

        <div class="container">

            <span class="section-label">
                COLLECTION
            </span>

            <h1>
                Oversized Essentials
            </h1>

            <p>
                Designed for everyday. Built to last.
            </p>

        </div>

    </section>

    <!-- FILTERS -->

    <section class="shop-toolbar">

        <div class="container toolbar-container">

            <div class="toolbar-left">

                <button class="filter-btn active">
                    All
                </button>

                <button class="filter-btn">
                    Hoodies
                </button>

                <button class="filter-btn">
                    Zip
                </button>

                <button class="filter-btn">
                    Limited
                </button>

            </div>

            <div class="toolbar-right">

                <select id="sort-products">

                    <option>Newest</option>

                    <option>Price ↑</option>

                    <option>Price ↓</option>

                </select>

            </div>

        </div>

    </section>

    <!-- PRODUCTS -->

    <section class="shop-products">

        <div class="container">

            <div
                id="shop-products"
                class="products-grid">

            </div>

        </div>

    </section>

</main>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="components/navbar.js"></script>
<script src="components/footer.js"></script>

<script src="assets/js/supabase.js"></script>
<script src="assets/js/product.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/animation.js"></script>
<script src="assets/js/app.js"></script>

</body>

</html>
